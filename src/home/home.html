<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Multi-Cursor Textareas — Home</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-128.png" alt="" />
        <div>
          <h1>Multi-Cursor Textareas</h1>
          <p>Adds multi-cursor editing to textareas</p>
        </div>
      </header>
      <section aria-labelledby="try-heading">
        <h2 id="try-heading">Example</h2>
        <textarea
          id="playground"
          aria-labelledby="try-heading"
          spellcheck="false"
        ></textarea>
        <p>
          Save your shortcuts, then try them here. Try each add-cursor shortcut
          again while holding Shift.
        </p>
        <p id="practice-status" role="status"></p>
      </section>
      <form id="settings">
        <section aria-labelledby="settings-heading">
          <h2 id="settings-heading">Settings</h2>
          <section aria-labelledby="shortcuts">
            <h3 id="shortcuts">Shortcuts</h3>
            <div class="shortcut">
              <label for="add-above-shortcut">
                Add cursor above main cursor
              </label>
              <div class="shortcut-buttons">
                <button type="button" id="add-above-shortcut"></button>
                <button
                  type="button"
                  class="shortcut-disable"
                  id="add-above-shortcut-disable"
                  aria-label="Disable add cursor above shortcut"
                  disabled
                ></button>
              </div>
            </div>
            <div class="shortcut">
              <label for="add-below-shortcut">
                Add cursor below main cursor
              </label>
              <div class="shortcut-buttons">
                <button type="button" id="add-below-shortcut"></button>
                <button
                  type="button"
                  class="shortcut-disable"
                  id="add-below-shortcut-disable"
                  aria-label="Disable add cursor below shortcut"
                  disabled
                ></button>
              </div>
            </div>
            <div class="shortcut">
              <label for="toggle-shortcut">Toggle cursor at location</label>
              <div class="shortcut-buttons">
                <button type="button" id="toggle-shortcut"></button>
                <button
                  type="button"
                  class="shortcut-disable"
                  id="toggle-shortcut-disable"
                  aria-label="Disable toggle cursor shortcut"
                  disabled
                ></button>
              </div>
            </div>
          </section>
          <section aria-labelledby="textareas">
            <h3 id="textareas">Textareas</h3>
            <div class="toggle">
              <label for="monospace">Monospace font</label>
              <input type="checkbox" id="monospace" />
            </div>
            <div class="toggle">
              <label for="no-wrap">Disable line wrapping</label>
              <input type="checkbox" id="no-wrap" />
            </div>
          </section>
          <footer>
            <button type="submit" id="save" disabled>Save changes</button>
            <button type="button" id="reset" disabled>Restore defaults</button>
            <span id="status" role="status" aria-live="polite">
              Loading settings…
            </span>
          </footer>
        </section>
      </form>
    </main>
    <script src="home.js"></script>
  </body>
</html>
